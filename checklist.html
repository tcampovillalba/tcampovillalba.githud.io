<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Sistema de Diseño</title>
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link href="https://fonts.googleapis.com/css?family=IBM+Plex+Mono|IBM+Plex+Sans:400,500,600&display=swap" rel="stylesheet">
  <style>
    .checklist {max-width: 800px;margin: 2rem auto;padding: 0 1rem;}
    .checklist h1 {margin-bottom: 1rem;}
    .checklist ul {list-style: none;padding-left: 0;}
    .checklist li {display: flex;align-items: center;margin-bottom: .5rem;}
    .checklist input[type=checkbox] {margin-right: .5rem;}
  </style>
</head>
<body>
  <div class="checklist">
    <h1 class="font-sans">Checklist para construir un sistema de diseño</h1>
    <ul class="font-mono">
      <li><label><input type="checkbox"> Inventario de UI</label></li>
      <li><label><input type="checkbox"> Definir paleta de colores</label></li>
      <li><label><input type="checkbox"> Definir tipografía</label></li>
      <li><label><input type="checkbox"> Iconografía y recursos visuales</label></li>
      <li><label><input type="checkbox"> Sistema de grid y layout</label></li>
      <li><label><input type="checkbox"> Componentes reutilizables</label></li>
      <li><label><input type="checkbox"> Patrones de interacción</label></li>
      <li><label><input type="checkbox"> Guía de estilo y documentación</label></li>
      <li><label><input type="checkbox"> Accesibilidad</label></li>
      <li><label><input type="checkbox"> Estrategia de versionado</label></li>
      <li><label><input type="checkbox"> Definir proceso de contribución</label></li>
    </ul>
  </div>
</body>
</html>
